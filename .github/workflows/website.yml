name: Publish website

on:
  push:
    branches: [main]
    paths: ['website/**', 'scripts/plugin-directory/**', 'internal/pluginregistry/**', 'internal/platformcatalog/**', '.github/workflows/website.yml', 'bun.lock', 'package.json', 'go.mod', 'go.sum']
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/configure-pages@v5
        id: pages
      - name: Discover and verify GitHub plugins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GOWORK=off go run -mod=readonly ./scripts/plugin-directory > "$RUNNER_TEMP/plugin-directory.json"
          mv "$RUNNER_TEMP/plugin-directory.json" website/src/plugin-directory.json
      - run: bun install --frozen-lockfile
      - name: Build website
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy

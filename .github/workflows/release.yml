name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check the version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Test the host
        run: GOWORK=off go test -mod=readonly ./...
      - name: Prepare the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v heading="## ${GITHUB_REF_NAME#v}" '
            /^## / { inside = ($0 == heading); next }
            inside
          ' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            flags=()
            if [[ $GITHUB_REF_NAME == *-alpha.* ]]; then
              flags=(--prerelease --latest=false)
              printf '\nmacOS 提供包含 .app 的 ZIP，由 Ubuntu 交叉构建。此 Alpha 的 macOS 产物未公证。\n' >> "$RUNNER_TEMP/notes.md"
            fi
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          fi
      - name: Publish Alpha
        if: contains(github.ref_name, '-alpha.')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/waygu-music-plugin/registry/main/catalog.json \
            | jq -e '.Format == 1 and (.Packages | length == 4)'
          bash scripts/build-alpha.sh "$RUNNER_TEMP/alpha-assets"
          cd "$RUNNER_TEMP/alpha-assets"
          sha256sum -c SHA256SUMS
          test "$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber \
            ./*.zip ./*.exe ./*.tar.gz SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
      - name: Publish stable release
        if: ${{ !contains(github.ref_name, '-alpha.') }}
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          test "$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          go tool mygo build -sign - -skip-dmg -skip-notarize -upload \
            -platform "darwin/amd64,darwin/arm64,windows/amd64,windows/arm64,linux/amd64,linux/arm64"
          version=${GITHUB_REF_NAME#v}
          slug=$(jq -er .slug mygo.json)
          assets=$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | select(.size > 0) | .name')
          require_asset() {
            if ! grep -Fxq -- "$1" <<< "$assets"; then
              printf 'Missing release asset %s\n' "$1" >&2
              return 1
            fi
          }
          require_asset SHA256SUMS
          for arch in amd64 arm64; do
            require_asset "$slug-setup-$version-$arch.exe"
            for os in darwin linux windows; do
              require_asset "$slug-$version-$os-$arch.tar.gz"
              require_asset "update-$os-$arch.json"
            done
          done
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest

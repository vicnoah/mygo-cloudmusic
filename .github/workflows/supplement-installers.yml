name: Supplement release installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published tag to supplement, such as v0.2.31 or v0.2.32-alpha.1
        required: true
        type: string

permissions:
  contents: write

env:
  CGO_ENABLED: "0"
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: supplement-installers-${{ inputs.tag }}

jobs:
  supplement:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Check target release
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+)?$ ]]
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
      - name: Prepare disk image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y hfsprogs 7zip libssl-dev zlib1g-dev libbz2-dev liblzma-dev
          bash scripts/build-dmg-tools.sh "$RUNNER_TEMP/dmg-tools"
          printf '%s\n' "$RUNNER_TEMP/dmg-tools" >> "$GITHUB_PATH"
      - name: Package the published macOS applications
        run: |
          version=${RELEASE_TAG#v}
          mkdir -p "$RUNNER_TEMP/archives" "$RUNNER_TEMP/installers"
          gh release download "$RELEASE_TAG" -p SHA256SUMS -D "$RUNNER_TEMP/archives"
          for arch in amd64 arm64; do
            bundle="$RUNNER_TEMP/archives/$arch"
            mkdir "$bundle"
            suffix=tar.gz
            if [[ $RELEASE_TAG == *-alpha.* ]]; then suffix=zip; fi
            archive="wagyu-music-$version-darwin-$arch.$suffix"
            gh release download "$RELEASE_TAG" -p "$archive" -D "$RUNNER_TEMP/archives"
            (
              cd "$RUNNER_TEMP/archives"
              awk -v name="$archive" '$2 == name' SHA256SUMS | sha256sum -c -
              if [[ $suffix == zip ]]; then
                unzip -q "$archive" -d "$bundle"
              else
                tar -xzf "$archive" -C "$bundle"
              fi
            )
            bash scripts/build-dmg.sh "$bundle/"*.app "$RUNNER_TEMP/installers/wagyu-music-$version-$arch.dmg"
          done
      - uses: actions/checkout@v7
        if: contains(inputs.tag, '-alpha.')
        with:
          ref: ${{ inputs.tag }}
          path: release-source
      - uses: actions/setup-go@v7
        if: contains(inputs.tag, '-alpha.')
        with:
          go-version-file: release-source/go.mod
          cache-dependency-path: release-source/go.sum
      - name: Build DEBs at the Alpha tag
        if: contains(inputs.tag, '-alpha.')
        working-directory: release-source
        run: |
          test "$RELEASE_TAG" = "v$(jq -er .version mygo.json)"
          version=${RELEASE_TAG#v}
          published_version=${version/-/.}
          if gh release download "$RELEASE_TAG" -p "wagyu-music_${published_version}_amd64.deb" \
            -p "wagyu-music_${published_version}_arm64.deb" -D "$RUNNER_TEMP/installers" \
            && test -f "$RUNNER_TEMP/installers/wagyu-music_${published_version}_amd64.deb" \
            && test -f "$RUNNER_TEMP/installers/wagyu-music_${published_version}_arm64.deb"; then
            echo "Reusing both DEBs already uploaded to this release."
          else
            GOWORK=off go tool mygo build -skip-dmg -skip-notarize -o "$RUNNER_TEMP/linux" -platform linux/amd64,linux/arm64
            for arch in amd64 arm64; do
              deb=("$RUNNER_TEMP/linux/linux-$arch/"*.deb)
              test "${#deb[@]}" = 1
              cp "${deb[0]}" "$RUNNER_TEMP/installers/wagyu-music_${published_version}_$arch.deb"
            done
          fi
          for arch in amd64 arm64; do
            deb="$RUNNER_TEMP/installers/wagyu-music_${published_version}_$arch.deb"
            test "$(dpkg-deb -f "$deb" Architecture)" = "$arch"
            test "$(dpkg-deb -f "$deb" Version)" = "${version/-/\~}"
          done
      - name: Upload the installers and extend the release checksums
        run: bash scripts/add-installers-to-release.sh "$RELEASE_TAG" "$RUNNER_TEMP/installers/"*
